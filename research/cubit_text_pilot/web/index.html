<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUBIT 人工审核工作台</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><b>CUBIT · 人工审核工作台</b><small>试标注 / 原始数据只读 / 尚无正式人工确认</small></div><span id="saveState">尚未保存</span><button id="save">保存新版本</button></header>
<div class="notice">数字类别映射未获作者确认 · 未标区域默认未知 · 仅十张 train 候选 · 任务层次和实例 ID 只作内部记录</div>
<main><aside><h2>01 图像与原始实例</h2><label>候选图像<select id="imageKey"></select></label><div id="sourceInfo" class="meta"></div><label>已有指令草稿<select id="draftList"><option value="">新建指令草稿</option></select></label><button id="reload">重载所选草稿</button><button id="newDraft">新建另一条指令</button><p class="hint">勾选可组合多个原始实例；“定位”仅改变视图。每一行不一定代表完整物理损伤。</p><div id="instances"></div><details><summary>来源哈希与风险</summary><pre id="hashes"></pre><p id="prior"></p></details></aside>
<section class="viewer"><div class="toolbar"><button id="fit">适应画面</button><button id="actual">原图 100%</button><button id="minus">−</button><output id="zoom"></output><button id="plus">＋</button><label><input type="checkbox" id="outline" checked>轮廓</label><label><input type="checkbox" id="mask">半透明 Mask</label><label><input type="checkbox" id="labels" checked>行号</label></div><div class="toolbar"><select id="mode"><option value="select">选择实例 / 拖动平移</option><option value="reference">绘制参照物框</option><option value="domain_proposed">绘制建议有效域</option><option value="unknown">绘制未知区域</option></select><span class="hint">滚轮缩放 · 拖动平移 · 框选保留原图归一化坐标</span></div><div id="canvasHost"><canvas id="canvas" aria-label="原始高分辨率图像与只读原始多边形"></canvas></div><div id="pointer" class="hint">加载中</div></section>
<aside class="editor"><h2>02 指令草稿</h2><label>操作人（必填）<input id="operator" autocomplete="off" placeholder="本人姓名或固定代号"></label><label>审核人（可暂空）<input id="reviewer" autocomplete="off"></label><label>审核状态<select id="review_status"><option value="draft">草稿</option><option value="needs_clarification">需澄清</option><option value="rejected">退回</option><option value="ready_for_human_review">待人工审核</option></select></label><label>自然语言指令<textarea id="instruction_text" rows="4" placeholder="由人工编写；不写类别数字、文件名、任务类型或实例 ID"></textarea></label>
<div class="two"><label>内部任务层次<select id="task_level"><option value="direct">直接指定损伤</option><option value="position">位置 / 对应关系</option><option value="reasoning">需要推理</option></select></label><label>内部推理子类<select id="reasoning_kind"><option value="none">无</option><option value="visual_semantic">视觉语义</option><option value="spatial">空间关系</option></select></label></div>
<label>临时视觉类别描述<input id="visual_class_provisional" placeholder="仅人工观察；不覆盖原数字类别"></label><label>有效域建议<select id="valid_domain"><option value="unknown">未知（默认）</option><option value="target_region_proposed">建议仅目标区域</option><option value="class_region_proposed">建议某类局部区域</option><option value="full_image_proposed">建议全图，待核验</option></select></label>
<h3>参照物与区域</h3><label>下一个参照物名称<input id="referenceName" placeholder="例如：窗框、墙角、管道"></label><div id="geometryList"></div><p class="hint">框仅属于派生审核记录，不改变 GT。选绘图模式后拖框；关系使用下方独立编辑器。</p>
<div class="two"><label>参照物<select id="relationRef"></select></label><label>关系<input id="relationName" placeholder="例如：下方、相交、对应"></label></div><label>关系依据 / 比较集合<textarea id="relationEvidence" rows="2"></textarea></label><button id="addRelation">将当前目标集合关联到参照物</button><div id="relationList"></div>
<h3>歧义与异常</h3><div id="risks" class="checks"></div><label>观察、疑问、组合理由与退回原因<textarea id="notes" rows="4"></textarea></label><label>本次修改说明<input id="change_reason"></label><h3>版本历史</h3><pre id="history">无已保存版本</pre><div id="message" role="status"></div></aside></main><script src="/app.js"></script></body></html>
