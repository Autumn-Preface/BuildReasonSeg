# =============================================================================
# Task 6E -- Explicit Spatial Token Grounding v0.1
#
# This is the Task 6C ablation recipe (Task 6B headline hyperparameters, unchanged)
# plus ONE new thing: an explicit spatial vocabulary.
#
#   frozen stack: Qwen3-VL-2B-Instruct (text-only LoRA) + SAM2.1 Hiera Base+
#   new tokens  : [BOX] and <loc_000>..<loc_{B-1}>  (B selected by the
#                 quantized-oracle audit, evaluation/task6e_quantized_oracle.json)
#   target      : {reasoning_zh} [BOX] <loc_x1> <loc_y1> <loc_x2> <loc_y2> [SEG]
#   objective   : 1.0 * assistant-span CE + 5.0 * location CE (no mask loss)
#
# Deliberately NOT here: 4B, [REF], Spatial Relation Encoder, Spatial Consistency
# Loss, a new dataset, full training, true batch > 1, GUI, or any SAM2 training.
# =============================================================================

task: "6E"
seed: 20260926
offline: true

models:
  qwen_model_id: "Qwen/Qwen3-VL-2B-Instruct"
  qwen_dtype: "bfloat16"
  qwen_attn_implementation: "sdpa"
  sam2_repo_id: "facebook/sam2.1-hiera-base-plus"
  sam2_checkpoint_file: "sam2.1_hiera_base_plus.pt"
  sam2_config_name: "configs/sam2.1/sam2.1_hiera_b+.yaml"
  sam2_source_revision_expected: "2b90b9f5ceec907a1c18123530e92e794ad901a4"

paths:
  local_cache: "local_cache"
  hf_cache: "local_cache/huggingface"
  models_dir: "local_cache/models"
  sam2_source: "local_cache/sam2_source"
  artifacts: "artifacts"
  stage_outputs: "artifacts/stage_outputs"
  checkpoints: "artifacts/checkpoints/task6e"
  feature_cache: "artifacts/sam2_feature_cache"

bridge:
  mode: "centre"

token:
  seg_token: "[SEG]"
  prefer_peft_trainable_token_indices: true

# Task 6E section 6: after `[SEG]`, add `[BOX]` and the shared location vocabulary.
# `bins` is the bin count chosen by section 5; `null` disables the whole path
# (so any Task 6A-6D runtime built from a config without this block is unaffected).
spatial_tokens:
  bins: 256
  box_token: "[BOX]"
  loc_template: "<loc_{index:03d}>"
  # Section 9: fixed weights, not swept.
  assistant_loss_weight: 1.0
  location_loss_weight: 5.0
  # Section 11: mini-train on the Task 6C paired P subset only.
  subset: "P"

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_suffixes: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  text_only: true

projection:
  hidden_dim: null
  dropout: 0.0

preprocessing:
  image_budget:
    set_explicitly: true
    min_pixels: 262144
    max_pixels: 262144

loss:
  # Kept for comparability with the Task 6C arms; the Task 6E objective never uses
  # the mask terms (section 9: no mask loss).
  lm_ce: 2.0
  mask_bce: 2.0
  mask_dice: 1.0
  note: "unused by the Task 6E objective; recorded for comparability with Task 6C"

optimizer:
  name: "adamw"
  betas: [0.9, 0.999]
  weight_decay: 0.01
  grad_clip_norm: 1.0
  # Task 6C phase-B rates, unchanged: LoRA 1e-4, token rows 3e-4.
  lora_lr: 1.0e-4
  token_lr: 3.0e-4
  warmup_steps: 20
  lr_schedule: "cosine"

training:
  bf16_autocast: true
  gradient_checkpointing: true
  use_cache: false
  deterministic: true
  deterministic_strict: true
  collect_grad_norms: false
  visual_feature_cache: true
  visual_feature_cache_max_images: 512
  train_at_original_resolution: true
  feature_cache_images: 480
  feature_cache_share_constants: true
  append_eos_to_target: true

e0:
  # Section 10: 20-record implementation sanity check, <= 1500 optimizer steps.
  samples: 20
  max_steps: 1500
  log_every_steps: 50
  gate:
    structural_valid_min: 19
    exact_four_token_min: 18
    mean_box_iou_min: 0.70

e1:
  # Section 11: 480 paired records, <= 3 epochs, corrected scheduler horizon.
  epochs: 3
  max_steps: 1440
  log_every_steps: 120
  gate:
    structural_valid_rate_min: 0.90
    geometry_paired_min: 14
    mean_box_iou_min: 0.35

inference:
  max_new_tokens: 96
  validation_max_new_tokens: 96
  do_sample: false
  mask_threshold: 0.0
  multimask_output: false
