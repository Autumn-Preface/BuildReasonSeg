# =============================================================================
# Task 6J Part E -- ProgramHead: instruction -> canonical program (text-only)
#
# This branch answers ONLY "what spatial program does the instruction request?".
# Input: instruction text only (chat formatting, NO image tokens). Output: one of the 20
# canonical program ids (the frozen BuildSpatialReason v0.1.1 query types, 1:1).
#
#   instruction -> Qwen text-only LoRA -> last-prompt-position hidden
#                -> LayerNorm -> Linear(2048, 20) -> program id
#
# Trainable: text-only LoRA + ProgramHead. Frozen: Qwen base, visual tower, everything else.
# No SAM2, no grounding heads, no free-form generation, no [REF]/SRE/SCL/4B/GUI.
# =============================================================================

task: "6J-J2"
seed: 20260926
offline: true

models:
  qwen_model_id: "Qwen/Qwen3-VL-2B-Instruct"
  qwen_dtype: "bfloat16"
  qwen_attn_implementation: "sdpa"

paths:
  local_cache: "local_cache"
  hf_cache: "local_cache/huggingface"
  models_dir: "local_cache/models"
  artifacts: "artifacts"
  stage_outputs: "artifacts/stage_outputs"
  checkpoints: "artifacts/checkpoints/task6j"

token:
  seg_token: "[SEG]"
  prefer_peft_trainable_token_indices: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_suffixes: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  text_only: true

optimizer:
  name: "adamw"
  betas: [0.9, 0.999]
  weight_decay: 0.01
  grad_clip_norm: 1.0
  lora_lr: 1.0e-4
  head_lr: 3.0e-4
  warmup_steps: 60
  lr_schedule: "cosine"

training:
  bf16_autocast: true
  gradient_checkpointing: true
  use_cache: false
  deterministic: true
  deterministic_strict: true

j2:
  # Section 12: query-type-stratified train-only subset, capped per program.
  records_per_program: 100
  max_records: 2000
  epochs: 5
  batch_size: 16
  max_length: 256
  log_every_steps: 125
  gate:
    program_accuracy_min: 0.90
    macro_f1_min: 0.85
    paired_program_correct_min: 18   # out of 20
