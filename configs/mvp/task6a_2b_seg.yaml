# =============================================================================
# Task 6A -- BuildReasonSeg-MVP smoke / overfit configuration
#
# Stack: Qwen3-VL-2B-Instruct -> [SEG] hidden -> ProjectionMLP -> SAM2.1 Hiera
#        Base+ mask decoder.
#
# Deliberately NOT here: Qwen3-VL-4B, [REF], Spatial Relation Encoder, Spatial
# Consistency Loss, full-dataset training.
#
# The loss weights are a PROVISIONAL smoke/overfit configuration, not a paper
# hyperparameter (Task 6A section 12).
# =============================================================================

task: "6A"
seed: 20260926

models:
  qwen_model_id: "Qwen/Qwen3-VL-2B-Instruct"
  qwen_dtype: "bfloat16"
  qwen_attn_implementation: "sdpa"      # FlashAttention is not used on native Windows
  sam2_repo_id: "facebook/sam2.1-hiera-base-plus"
  sam2_checkpoint_file: "sam2.1_hiera_base_plus.pt"
  sam2_config_name: "configs/sam2.1/sam2.1_hiera_b+.yaml"
  sam2_source_revision_expected: "2b90b9f5ceec907a1c18123530e92e794ad901a4"

paths:
  local_cache: "local_cache"
  hf_cache: "local_cache/huggingface"
  models_dir: "local_cache/models"
  sam2_source: "local_cache/sam2_source"
  artifacts: "artifacts"
  stage_outputs: "artifacts/stage_outputs"
  checkpoints: "artifacts/checkpoints"
  feature_cache: "artifacts/sam2_feature_cache"

token:
  seg_token: "[SEG]"
  # PEFT's trainable_token_indices is preferred; the project-owned token-row hook
  # is the documented fallback. Never unfreeze the full embedding matrix.
  prefer_peft_trainable_token_indices: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_suffixes: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  text_only: true                      # asserted: zero LoRA modules under the visual tower

projection:
  hidden_dim: null                     # null => max(out_dim, in_dim // 2)
  dropout: 0.0

preprocessing:
  # Qwen and SAM2 are SEPARATE branches (Task 6A section 3.5).
  # The source WHU tile is 512x512. Do NOT hard-code a visual-token count; the
  # processor output is measured at runtime and recorded.
  image_budget:
    set_explicitly: true
    min_pixels: 262144                  # 512*512
    max_pixels: 262144                  # native tile; no upscaling
  resize_qwen_branch: false
  sam2_branch: "official SAM2ImagePredictor transform"

loss:
  # Adjusted AFTER the first three Stage 2 runs were recorded (all kept in the
  # smoke report history / logs), as Task 6A section 12 permits.
  # Run 3 (mask-dominant 0.5/4.0/2.0) reached mean mIoU 0.8995 and 10/10 paired
  # instruction dependence, but the assistant text was under-trained
  # (LM accuracy 0.005) so free generation repeated [SEG]. The language weight is
  # therefore lifted while the mask objective stays dominant.
  lm_ce: 1.5
  mask_bce: 4.0
  mask_dice: 3.0
  note: "provisional smoke/overfit weights; mask-dominant, Dice raised for small targets"

optimizer:
  name: "adamw"
  lora_lr: 1.0e-4
  head_lr: 3.0e-4
  # The projection is randomly initialised and the SAM2 mask decoder is being
  # repurposed, so both need a higher rate than the pretrained LoRA adapters.
  decoder_lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0
  token_weight_decay: 0.0              # zero weight decay on the [SEG] representation
  lr_schedule: "cosine"
  warmup_steps: 40

training:
  batch_size: 1
  grad_accum_steps: 1
  bf16_autocast: true
  gradient_checkpointing: true
  use_cache: false
  deterministic: true
  # Task 6A section 11.4 offers both options. Run 4 supervised at 256x256 logit
  # resolution and two small targets (148 px, 298 px) capped out around 0.87 while
  # everything else exceeded 0.90. Supervising at the original 512x512 resolution
  # removes that ceiling for small objects.
  train_at_original_resolution: true

stage1_smoke:
  samples: 2
  optimizer_steps: 1
  require_zero_trainable_in_visual_tower: true
  require_frozen_sam_encoder_no_grad: true

stage2_overfit:
  images: 10
  per_image: 2
  # Wall-clock bound is the binding constraint: Task 6A section 16.2 offers
  # "max 1000 optimizer steps OR ~2-3 hours wall time". Runs 1-3 used the step
  # bound; run 4 uses the wall-clock bound because the mean training mIoU was
  # still improving at step 1000 (0.8996) and one 148 px target lagged.
  max_steps: 2000
  max_minutes: 175
  eval_every: 50
  target_train_miou: 0.90
  target_pair_successes: 9              # out of 10
  target_seg_emission: 20               # out of 20
  use_sam_feature_cache: true
  early_stop_patience: 200
  append_eos_to_target: true            # teach the model to stop after [SEG]

inference:
  max_new_tokens: 128                   # reasoning_zh is ~40-60 tokens + [SEG]
  do_sample: false                      # deterministic for the smoke proof
  mask_threshold: 0.0
  multimask_output: false
