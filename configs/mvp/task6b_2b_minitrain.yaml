# =============================================================================
# Task 6B -- 2B real mini-train and first generalization audit
#
# Architecture is the Task 6A proof stack, unchanged (ADR-013):
#   Qwen3-VL-2B-Instruct -> [SEG] hidden -> Projection MLP -> SAM2.1 Hiera Base+
#
# Deliberately NOT here: Qwen3-VL-4B, [REF], Spatial Relation Encoder, Spatial
# Consistency Loss, full-dataset training, external datasets.
#
# The run is OFFLINE by necessity: huggingface.co is not resolvable on this
# network after the local accelerator was removed (evaluation/task6b_network_cleanup.json).
# The 2B and SAM2 Base+ assets are already cached under local_cache/.
# =============================================================================

task: "6B"
seed: 20260926
offline: true

models:
  qwen_model_id: "Qwen/Qwen3-VL-2B-Instruct"
  qwen_dtype: "bfloat16"
  qwen_attn_implementation: "sdpa"
  sam2_repo_id: "facebook/sam2.1-hiera-base-plus"
  sam2_checkpoint_file: "sam2.1_hiera_base_plus.pt"
  sam2_config_name: "configs/sam2.1/sam2.1_hiera_b+.yaml"
  sam2_source_revision_expected: "2b90b9f5ceec907a1c18123530e92e794ad901a4"

paths:
  local_cache: "local_cache"
  hf_cache: "local_cache/huggingface"
  models_dir: "local_cache/models"
  sam2_source: "local_cache/sam2_source"
  artifacts: "artifacts"
  stage_outputs: "artifacts/stage_outputs"
  checkpoints: "artifacts/checkpoints/task6b"
  feature_cache: "artifacts/sam2_feature_cache"

token:
  seg_token: "[SEG]"
  prefer_peft_trainable_token_indices: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_suffixes: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  text_only: true

projection:
  hidden_dim: null
  dropout: 0.0

preprocessing:
  # Qwen (256 visual tokens) and SAM2 (1024x1024) are SEPARATE branches from the
  # same 512x512 source tile.
  image_budget:
    set_explicitly: true
    min_pixels: 262144
    max_pixels: 262144

loss:
  # Task 6B section 12 initial objective.
  lm_ce: 2.0
  mask_bce: 2.0
  mask_dice: 1.0
  note: "Task 6B section 12 initial weights; one bounded adjustment allowed after the first full documented Phase-B epoch"

optimizer:
  name: "adamw"
  betas: [0.9, 0.999]
  weight_decay: 0.01
  grad_clip_norm: 1.0
  phase_a:
    lora_lr: 1.0e-4
    token_lr: 3.0e-4
    warmup_steps: 20
    lr_schedule: "cosine"
  phase_b:
    lora_lr: 1.0e-4
    token_lr: 3.0e-4
    decoder_lr: 3.0e-4
    warmup_steps: 20
    lr_schedule: "cosine"

training:
  bf16_autocast: true
  gradient_checkpointing: true
  use_cache: false
  deterministic: true
  train_at_original_resolution: true
  # Bounded LRU cache of detached frozen SAM2 features (Task 6B section 18).
  # Stored on CPU; ~10.5 MB per image, so 160 images ~= 1.7 GB, inside the 8 GB cap.
  feature_cache_images: 160

phase_a:
  # Language-format warm-up: text LoRA + [SEG] only. Projection MLP and SAM2 mask
  # decoder are frozen. LM CE only.
  epochs: 1
  grad_accum_steps: 1
  eval_every_steps: 120
  log_every_steps: 40

phase_b:
  # Joint segmentation training, continuing from Phase A.
  epochs: 5
  grad_accum_steps: 1
  max_steps: 2400
  early_stop_patience: 2
  log_every_steps: 40

validation:
  per_epoch_teacher_forced: true
  per_epoch_free_generation: true
  # best_joint selection rule, DEFINED BEFORE PHASE B AND NOT CHANGED AFTERWARDS:
  #   1. higher valid [SEG] emission rate
  #   2. higher strict end-to-end val mIoU
  #   3. higher operation-chain accuracy
  #   4. lower LM CE
  best_joint_rule: ["valid_seg_emission_rate", "strict_end_to_end_miou", "operation_chain_accuracy", "lm_ce"]

inference:
  max_new_tokens: 64
  validation_max_new_tokens: 64
  do_sample: false
  mask_threshold: 0.0
  multimask_output: false
