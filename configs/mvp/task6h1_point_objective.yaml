# =============================================================================
# Task 6H.1 -- Spatial-Softmax Point Supervision + Bounded Counterfactual Grounding
#
# Architecture frozen at Task 6G/6H (no new module, no extra query token, no cross-attention).
# Only the spatial supervision target changes, to be directly aligned with the deployed inference
# operation (`argmax` of the heatmap):
#
#   image + instruction -> [BOX] -> query hidden -> DenseSpatialGroundingHead -> heatmap -> argmax
#
#   target point-cell : frozen Task 6D interior point -> 256x256 cell -> index = y*256 + x
#   L_point           = CrossEntropy(H.flatten(), target_index)         (65,536 spatial classes)
#   P                 = softmax(H.flatten());  mass(P, M) = sum(P * M)  (bounded, no area division)
#   L_cf_A/B          = -log((p_own + eps) / (p_own + p_cross + 2*eps))
#   L_total           = 0.5*(L_reasoning_A + L_reasoning_B)
#                     + 1.0*(L_point_A + L_point_B)
#                     + 1.0*L_cf
#
# Task 6G's BCE+Dice and Task 6H's raw-logit ranking are logged only and contribute ZERO gradient.
# Deliberately NOT here: [REF], SRE, SCL, 4B, a new dataset, full training, true batch > 1, GUI,
# or any SAM2 training.
# =============================================================================

task: "6H.1"
seed: 20260926
offline: true

models:
  qwen_model_id: "Qwen/Qwen3-VL-2B-Instruct"
  qwen_dtype: "bfloat16"
  qwen_attn_implementation: "sdpa"
  sam2_repo_id: "facebook/sam2.1-hiera-base-plus"
  sam2_checkpoint_file: "sam2.1_hiera_base_plus.pt"
  sam2_config_name: "configs/sam2.1/sam2.1_hiera_b+.yaml"
  sam2_source_revision_expected: "2b90b9f5ceec907a1c18123530e92e794ad901a4"

paths:
  local_cache: "local_cache"
  hf_cache: "local_cache/huggingface"
  models_dir: "local_cache/models"
  sam2_source: "local_cache/sam2_source"
  artifacts: "artifacts"
  stage_outputs: "artifacts/stage_outputs"
  checkpoints: "artifacts/checkpoints/task6h1"
  feature_cache: "artifacts/sam2_feature_cache"

bridge:
  mode: "centre"

token:
  seg_token: "[SEG]"
  prefer_peft_trainable_token_indices: true

# Task 6F/6G/6H query token, reused unchanged (no new query token in Task 6H.1).
box_query:
  enabled: true
  box_token: "[BOX]"

# Task 6G head, frozen in size: 256x256 level, 128-d keys, scalar bias.
dense_grounding:
  enabled: true
  grid: 256
  key_dim: 128
  scalar_bias: true
  reasoning_loss_weight: 1.0
  heatmap_loss_weight: 2.0
  heatmap_bce_weight: 1.0
  heatmap_dice_weight: 1.0

# Task 6H pair semantics (unchanged) + the corrected bounded objective (sections 5-11).
counterfactual:
  pairs_per_epoch: 240
  margin: 1.0

point_objective:
  enabled: true
  eps: 1.0e-8
  classification_weight: 1.0
  cf_weight: 1.0
  reasoning_weight: 0.5
  # Sections 8-9: the Task 6H raw-logit ranking and the Task 6G BCE+Dice are diagnostics only.
  legacy_bce_dice_gradient: false
  legacy_logit_ranking_gradient: false
  max_mean_abs_logit: 10.0

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_suffixes: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  text_only: true

projection:
  hidden_dim: null
  dropout: 0.0

preprocessing:
  image_budget:
    set_explicitly: true
    min_pixels: 262144
    max_pixels: 262144

loss:
  # Kept for comparability; the Task 6H.1 objective never uses these terms.
  lm_ce: 2.0
  mask_bce: 2.0
  mask_dice: 1.0
  note: "unused by the Task 6H.1 objective; recorded for comparability with Task 6C"

optimizer:
  name: "adamw"
  betas: [0.9, 0.999]
  weight_decay: 0.01
  grad_clip_norm: 1.0
  lora_lr: 1.0e-4
  token_lr: 3.0e-4
  decoder_lr: 3.0e-4
  warmup_steps: 20
  lr_schedule: "cosine"

training:
  bf16_autocast: true
  gradient_checkpointing: true
  use_cache: false
  deterministic: true
  deterministic_strict: true
  collect_grad_norms: false
  visual_feature_cache: true
  visual_feature_cache_max_images: 512
  train_at_original_resolution: true
  feature_cache_images: 500
  feature_cache_share_constants: true
  append_eos_to_target: true

h0r:
  # Section 12: same 10 canonical H0 pairs, clean initialization, <= 1500 PAIR steps.
  pairs: 10
  max_pair_steps: 1500
  eval_every: 250
  log_every_steps: 50
  min_steps_before_stop: 250
  gate:
    point_inside_own_min: 18     # out of 20
    paired_point_selection_min: 9  # out of 10
    pair_ranking_min: 9          # out of 10
    max_mean_abs_logit: 10.0

h1r:
  # Section 15: 240 canonical pairs per epoch, maximum 8 epochs.
  epochs: 8
  pairs_per_epoch: 240
  max_pair_steps: 1920
  log_every_steps: 60
  gate:
    paired_point_selection_min: 14   # out of 20
    pair_ranking_min: 14             # out of 20
    point_inside_target_min: 0.60

inference:
  max_new_tokens: 96
  validation_max_new_tokens: 96
  do_sample: false
  mask_threshold: 0.0
  multimask_output: false
